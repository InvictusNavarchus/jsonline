<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Line Converter & JSON Escaper</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --code-bg: #0b1120;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    header {
      text-align: center;
    }

    header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 0.25rem;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    textarea {
      width: 100%;
      height: 160px;
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem;
      color: var(--text);
      font-family: "Fira Code", monospace, Consolas, "Courier New";
      font-size: 0.9rem;
      line-height: 1.4;
      resize: vertical;
      outline: none;
    }

    textarea:focus {
      border-color: var(--accent);
    }

    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .options-group {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .options-group h3 {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent);
      margin-bottom: 0.25rem;
    }

    .option-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.88rem;
      cursor: pointer;
      color: var(--text);
    }

    .option-item input[type="checkbox"],
    .option-item input[type="radio"] {
      accent-color: var(--accent);
      cursor: pointer;
    }

    .actions {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    button {
      flex: 1;
      padding: 0.75rem 1rem;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      transition: background 0.15s ease;
    }

    .btn-primary {
      background: var(--accent);
      color: #0f172a;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-secondary {
      background: #334155;
      color: var(--text);
    }

    .btn-secondary:hover {
      background: #475569;
    }

    .btn-copy {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--accent);
      padding: 0.3rem 0.6rem;
      font-size: 0.75rem;
      border-radius: 4px;
      flex: none;
    }

    .btn-copy:hover {
      background: var(--border);
    }

    @media (max-width: 600px) {
      .controls-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Line Converter & JSON Escaper</h1>
    <p>Convert multiline text to single-line JSON payloads and vice-versa</p>
  </header>

  <!-- Input Panel -->
  <div class="panel">
    <div class="panel-header">
      <span>INPUT</span>
      <button class="btn-copy" onclick="clearInput()">Clear</button>
    </div>
    <textarea id="inputText" placeholder="Paste your multiline text or escaped JSON string here..."></textarea>
  </div>

  <!-- Options -->
  <div class="controls-grid">
    <div class="options-group">
      <h3>Multiline &rarr; Single Line</h3>
      <label class="option-item">
        <input type="radio" name="singleLineStyle" value="literal" checked>
        Escape as literal <code>\n</code> (for JSON payloads)
      </label>
      <label class="option-item">
        <input type="radio" name="singleLineStyle" value="space">
        Replace newlines with a single space
      </label>
      <label class="option-item">
        <input type="radio" name="singleLineStyle" value="none">
        Remove newlines completely (no separator)
      </label>
      <label class="option-item">
        <input type="checkbox" id="escapeQuotes">
        Also escape double quotes (<code>"</code> &rarr; <code>\"</code>)
      </label>
    </div>

    <div class="options-group">
      <h3>Single Line &rarr; Multiline</h3>
      <label class="option-item">
        <input type="checkbox" id="parseLiteralSlashN" checked>
        Convert literal <code>\n</code> into real newlines
      </label>
      <label class="option-item">
        <input type="checkbox" id="parseLiteralSlashR" checked>
        Remove/parse literal <code>\r</code>
      </label>
      <label class="option-item">
        <input type="checkbox" id="unescapeQuotes" checked>
        Unescape quotes (<code>\"</code> &rarr; <code>"</code>)
      </label>
      <label class="option-item">
        <input type="checkbox" id="stripSurroundingQuotes">
        Strip enclosing quotes (e.g. <code>"..."</code>)
      </label>
    </div>
  </div>

  <!-- Action Buttons -->
  <div class="actions">
    <button class="btn-primary" onclick="convertToSingleLine()">
      Multiline &rarr; Single Line
    </button>
    <button class="btn-primary" onclick="convertToMultiLine()">
      Single Line &rarr; Multiline
    </button>
    <button class="btn-secondary" onclick="swapPanels()">
      &#x21C5; Swap Panels
    </button>
  </div>

  <!-- Output Panel -->
  <div class="panel">
    <div class="panel-header">
      <span>OUTPUT</span>
      <button class="btn-copy" id="copyBtn" onclick="copyOutput()">Copy Result</button>
    </div>
    <textarea id="outputText" readonly placeholder="Output will appear here..."></textarea>
  </div>
</div>

<script>
  function convertToSingleLine() {
    let text = document.getElementById('inputText').value;
    const style = document.querySelector('input[name="singleLineStyle"]:checked').value;
    const escapeQuotes = document.getElementById('escapeQuotes').checked;

    // Normalize standard line endings
    text = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');

    if (escapeQuotes) {
      // Escape backslashes first, then quotes
      text = text.replace(/\\/g, '\\\\').replace(/"/g, '\\"');
    }

    if (style === 'literal') {
      text = text.replace(/\n/g, '\\n');
    } else if (style === 'space') {
      text = text.replace(/\n+/g, ' ');
    } else if (style === 'none') {
      text = text.replace(/\n+/g, '');
    }

    document.getElementById('outputText').value = text;
  }

  function convertToMultiLine() {
    let text = document.getElementById('inputText').value;
    const parseSlashN = document.getElementById('parseLiteralSlashN').checked;
    const parseSlashR = document.getElementById('parseLiteralSlashR').checked;
    const unescapeQuotes = document.getElementById('unescapeQuotes').checked;
    const stripQuotes = document.getElementById('stripSurroundingQuotes').checked;

    // Strip outer quotes if copied directly from raw JSON string value
    if (stripQuotes) {
      text = text.trim();
      if ((text.startsWith('"') && text.endsWith('"')) || (text.startsWith("'") && text.endsWith("'"))) {
        text = text.slice(1, -1);
      }
    }

    if (parseSlashR) {
      text = text.replace(/\\r/g, '');
    }

    if (parseSlashN) {
      text = text.replace(/\\n/g, '\n');
    }

    if (unescapeQuotes) {
      text = text.replace(/\\"/g, '"');
    }

    document.getElementById('outputText').value = text;
  }

  function swapPanels() {
    const input = document.getElementById('inputText');
    const output = document.getElementById('outputText');
    const temp = input.value;
    input.value = output.value;
    output.value = temp;
  }

  function clearInput() {
    document.getElementById('inputText').value = '';
    document.getElementById('inputText').focus();
  }

  function copyOutput() {
    const output = document.getElementById('outputText');
    if (!output.value) return;

    navigator.clipboard.writeText(output.value).then(() => {
      const copyBtn = document.getElementById('copyBtn');
      const originalText = copyBtn.innerText;
      copyBtn.innerText = 'Copied!';
      setTimeout(() => {
        copyBtn.innerText = originalText;
      }, 1500);
    });
  }
</script>

</body>
</html>
